spring.application.name=scheduler

# connectTimeout: TCP 建连这一步的超时。socketTimeout: 连接已建立后、等一条
# 查询返回结果的超时——网络分区场景下往往是后者更关键，连接池里现成的连接
# 分区时不是连不上，是发出去的查询永远等不到响应，只有 socketTimeout 能兜住。
# 与 8/8 "sink 超时必须严格小于租约 TTL(30s)" 同一类考虑：5s 远小于 30s，
# 分区节点会快速失败而不是无限挂起。本应用所有查询都是走索引的点查，5s 宽裕。
spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler?connectTimeout=5&socketTimeout=5
spring.datasource.username=scheduler
spring.datasource.password=scheduler
management.endpoints.web.exposure.include=health,metrics
