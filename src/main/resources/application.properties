spring.application.name=scheduler

# socketTimeout is the one that matters under a network partition (scenario 5):
# a pooled connection that is already established does not fail to connect, it
# sends a query that never gets a response, and only socketTimeout bounds that.
# Same reasoning as "sink timeout strictly below the 30s lease TTL": 5s is well
# under 30s, so a partitioned node fails fast instead of hanging. Every query
# here is an index lookup, so 5s is ample.
spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler?connectTimeout=5&socketTimeout=5
spring.datasource.username=scheduler
spring.datasource.password=scheduler
management.endpoints.web.exposure.include=health,metrics,prometheus

# Load-test tuning; see docs/performance.md §2. claim-limit 500 -> 2000 clears
# the 5,000/s peak SLO. The bounded executor queue and PollingLoop's
# fire-capacity check hold the effective claim rate to what the pool can drain
# inside the 30s lease, so 2000 is a ceiling, not a fixed batch.
chronos.poll.claim-limit=2000
chronos.executor.threads=16
chronos.executor.queue-capacity=2000
