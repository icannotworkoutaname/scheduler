name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Only SchedulerApplicationTests (@SpringBootTest → application.properties →
    # localhost:5432) needs this. The chaos-scenario tests each spin their own
    # throwaway Postgres via Testcontainers against the runner's Docker daemon.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scheduler
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler -d scheduler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Covers, in CI, the eight chaos scenarios:
      #   1 shard failover ....... ShardFailoverTest
      #   2 persistent failure ... RetryDeadLetterTest
      #   3 duplicate submit ..... ShardClaimRaceTest
      #   4 cancel/fire race ..... CancelFireRaceTest
      #   7 clock offset ......... ClockOffsetTest
      #   8 clock drift .......... ClockDriftTest
      # Scenarios 5 (network partition) and 6 (node freeze) stay as the dev
      # scripts under scripts/ — they need kill -STOP / a TCP proxy that don't
      # fit a JUnit lifecycle cleanly. Their invariants are covered indirectly:
      # 5's "reclaim on lost connection" is the same reaper path as 2, and 6's
      # "stale-version write is a no-op" is the same optimistic lock asserted
      # throughout.
      #
      # ShardRebalanceConvergenceTest guards the 8/23 rebalance fix: with 3
      # nodes the downward release path actually runs, and this asserts the
      # split converges AND then stops moving (no oscillation).
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
